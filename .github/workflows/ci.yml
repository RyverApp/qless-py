name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis-version: [6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: pipx install pipenv

      - run: make deps

      - run: make test
        env:
          REDIS_IMAGE: redis:${{ matrix.redis-version }}-alpine
